<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="islamic" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Fondo -->
      <rect width="100" height="100" fill="#FFFFFF"/>
      
      <!-- Estrella octogonal central -->
      <g transform="translate(50,50)" stroke="#666666" stroke-width="0.8" fill="none" opacity="0.5">
        <!-- Estrella de 8 puntas -->
        <polygon points="0,-35 10,-10 35,-10 15,10 25,35 0,20 -25,35 -15,10 -35,-10 -10,-10" />
        <!-- Círculo interior -->
        <circle r="12" stroke-width="0.5"/>
        <!-- Líneas radiales -->
        <line x1="0" y1="-35" x2="0" y2="-12" />
        <line x1="0" y1="35" x2="0" y2="12" />
        <line x1="-35" y1="0" x2="-12" y2="0" />
        <line x1="35" y1="0" x2="12" y2="0" />
        <line x1="-25" y1="-25" x2="-8" y2="-8" />
        <line x1="25" y1="25" x2="8" y2="8" />
        <line x1="-25" y1="25" x2="-8" y2="8" />
        <line x1="25" y1="-25" x2="8" y2="-8" />
        <!-- Rombo central -->
        <polygon points="0,-8 8,0 0,8 -8,0" fill="#666666" opacity="0.4"/>
      </g>
      
      <!-- Esquinas decorativas -->
      <g opacity="0.4">
        <circle cx="10" cy="10" r="6" stroke="#000000" stroke-width="0.5" fill="none"/>
        <circle cx="90" cy="10" r="6" stroke="#000000" stroke-width="0.5" fill="none"/>
        <circle cx="10" cy="90" r="6" stroke="#000000" stroke-width="0.5" fill="none"/>
        <circle cx="90" cy="90" r="6" stroke="#000000" stroke-width="0.5" fill="none"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#islamic)"/>
</svg>